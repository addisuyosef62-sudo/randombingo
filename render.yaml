services:
  - type: web
    name: randombingo-api
    runtime: python
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      - key: WEB_APP_URL
        value: https://randombingo.onrender.com/app
      - key: PUBLIC_BASE_URL
        value: https://randombingo.onrender.com
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
